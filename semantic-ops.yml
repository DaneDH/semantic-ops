main_branch: main
tag_prefix: v
default_bump: patch
precedence: commit-first
default_postfix: ""
initial_version: "1.0.0"     # first release on a channel with no prior tag -- used as-is, no update applied
create_release: false         # false = tag only, no GitHub Release (e.g. to leave a tag free for manual Marketplace publishing)
release_branch_rules:         # if create_release were true, only these branches would actually release (tagging is unaffected either way)
  - '^main$'
force_patch_after_first_push: true   # true = every push after a branch's first one is forced to patch, ignoring branch_rules/commit_rules; never restricts main_branch

branch_rules:
  major:
    - '^release/major/'
  minor:
    - '^feature/'
    - '^release/minor/'
  patch:
    - '^hotfix/'
    - '^bugfix/'
    - '^patch/'
    - '^doc/'

commit_rules:
  major:
    - '^BREAKING CHANGE'
    - '!:'
  minor:
    - '^feat(\(.+\))?:'
    - '^feature/'
  patch:
    - '^fix(\(.+\))?:'
    - '^doc(\(.+\))?:'
    - '^patch(\(.+\))?:'

branch_postfix_rules:
  - pattern: '^alpha/|/alpha$'
    postfix: alpha
  - pattern: '^beta/|/beta$'
    postfix: beta
  - pattern: '^feature/|/feature$'
    postfix: beta
  - pattern: '^patch/|/patch$'
    postfix: beta
  - pattern: '^fix/|/fix$'
    postfix: beta
